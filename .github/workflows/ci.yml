name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci --ignore-scripts
      # The root typecheck reads the desktop app's Electron types.
      - run: npm ci --ignore-scripts --prefix desktop
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # npm run build doesn't build the supervisor.
      - run: npm run build:supervisor
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  ui:
    name: UI check (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:ui
        env:
          CHROME: /usr/bin/google-chrome
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ui-screenshots
          path: ui-shots/

  paseo-compat:
    name: Paseo ${{ matrix.paseo }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The pinned 0.9.2 run is required. The latest Paseo release is checked too,
    # as an early warning, but its failure doesn't fail CI.
    continue-on-error: ${{ matrix.paseo == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        paseo: ['0.9.2', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Paseo daemon ${{ matrix.paseo }}
        env:
          PASEO_VERSION: ${{ matrix.paseo }}
        run: npm install --prefix "$RUNNER_TEMP/paseo" --ignore-scripts --no-audit --no-fund "@getpaseo/server@$PASEO_VERSION"
      - name: Run Wayroost against a real Paseo daemon (fake ACP agent)
        run: npm run check:paseo -- "$RUNNER_TEMP/paseo/node_modules/@getpaseo/server"
      - name: Check that Paseo enforces per-provider tool limits (fake ACP agents)
        run: npm run check:paseo-tools -- "$RUNNER_TEMP/paseo/node_modules/@getpaseo/server"

  desktop:
    name: Windows desktop installer
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Install root test dependencies
        run: npm ci --ignore-scripts
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:config
      # The desktop marker on the wire, from a real Electron run.
      - run: npx electron dist/desktop/src/app-header-check.js
      - name: Verify every TLS transport and zero credential bytes on pin mismatch
        run: npx electron dist/desktop/src/tls-check.js
      - run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run check:fuses -- release/win-unpacked/Wayroost.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wayroost-windows-installer
          path: desktop/release/*.exe
          if-no-files-found: error
