name: wayroost-identity
version: "0.2.0"
description: "Tells the Wayroost project bridge which Hermes chat is calling it (the hidden _wayroost_caller argument on mcp__wayroost__* calls (legacy aliases during the rename transition), sent as a header), and reports once per process which agent's shell started this Hermes (launcher ids from the starting environment only), so Wayroost can nest it. Does nothing in Hermes agents that Paseo runs."
author: "Wayroost"
provides_hooks:
  - on_session_start
  - pre_tool_call
